[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "icuewidget-cli"
version = "0.2.2"
description = "CLI for creating and packaging iCUE widgets"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Corsair Team" }
]
license = { text = "Proprietary" }
scripts = { icuewidget = "icuewidget_cli.cli:main" }
dependencies = [
  "questionary>=2.0,<3.0",
  "typer>=0.12,<1.0",
  "rich>=13.7,<14.0",
  "esprima>=4.0,<5.0",
  "tinycss2>=1.4,<2.0"
]

[project.optional-dependencies]
build = [
  "pyinstaller>=6.0"
]

[tool.setuptools]
packages = ["icuewidget_cli"]

[tool.pyinstaller]
console = true
