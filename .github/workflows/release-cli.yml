name: Release CLI

on:
  workflow_dispatch:
  push:
    tags:
      - "icuewidget-cli-v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip && python -m pip install .[build]

      - name: Build standalone binary
        run: python build_standalone.py

      - name: Prepare Windows signing metadata
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "Windows signing placeholder step"
          Write-Host "Expected secrets/cert material should be added by DevOps before enabling Authenticode signing."

      - name: Sign Windows executable placeholder
        if: runner.os == 'Windows' && false
        shell: pwsh
        run: |
          # Example future step:
          # signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f signing-cert.pfx /p $env:WINDOWS_CERT_PASSWORD release\icuewidget-*.exe
          throw "Enable after Windows signing secrets and certificate handling are configured."

      - name: Prepare macOS signing and notarization metadata
        if: runner.os == 'macOS'
        run: |
          echo "macOS signing/notarization placeholder step"
          echo "Expected secrets: APPLE_DEVELOPER_ID_CERT_BASE64, APPLE_DEVELOPER_ID_CERT_PASSWORD, APPLE_TEAM_ID, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD"

      - name: Code sign macOS binary placeholder
        if: runner.os == 'macOS' && false
        run: |
          # Example future step:
          # security create-keychain -p "$RUNNER_TEMP" build.keychain
          # security import developer-id.p12 -k build.keychain -P "$APPLE_DEVELOPER_ID_CERT_PASSWORD" -T /usr/bin/codesign
          # codesign --force --options runtime --sign "Developer ID Application: <Team Name> (<TEAMID>)" release/icuewidget-*/icuewidget
          exit 1

      - name: Notarize macOS archive placeholder
        if: runner.os == 'macOS' && false
        run: |
          # Example future step:
          # xcrun notarytool submit release/icuewidget-*.zip --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --wait
          exit 1

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: icuewidget-${{ runner.os }}
          path: release/*

  publish:
    if: startsWith(github.ref, 'refs/tags/icuewidget-cli-v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
