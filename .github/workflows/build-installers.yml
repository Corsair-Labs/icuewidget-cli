name: Build Installers

on:
  workflow_dispatch:
    inputs:
      cli_package_spec:
        description: "npm package spec, tarball URL/path, or . for the checked-out CLI"
        required: false
        default: "."

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Install NSIS
        run: choco install nsis -y
      - name: Build Windows installer
        shell: pwsh
        run: |
          $env:CLI_PACKAGE_SPEC = "${{ inputs.cli_package_spec }}"
          $env:PKG_TARGETS = "node20-win-x64"
          $env:CLI_BUILD_PATCH = "${{ github.run_number }}"
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Install icon tool
        run: brew install fileicon
      - name: Build macOS installer
        run: |
          export CLI_PACKAGE_SPEC="${{ inputs.cli_package_spec }}"
          export PKG_TARGETS="node20-macos-arm64,node20-macos-x64"
          export CLI_BUILD_PATCH="${{ github.run_number }}"
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: release/*.pkg
