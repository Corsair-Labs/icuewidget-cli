name: CLI CI

on:
  pull_request:
  push:
    branches:
      - main
      - feature/node-npx-cli

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify npm package contents
        run: npm pack --dry-run
